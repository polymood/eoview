[package]
name = "eoview"
description = "Fast viewer for Earth observation data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
eo-core.workspace = true
eo-io.workspace = true
eo-cache.workspace = true
eo-render.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
egui-winit = "0.36"
pollster = "1.0.1"
rfd = "0.17.2"
winit = "0.30.13"
egui_dock = { version = "0.21", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The splash window. No KMS backend.
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
png = "0.18"

[build-dependencies]
winresource = "0.1.31"
