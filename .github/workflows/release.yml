name: Release

# A tag v* on main (the version of Cargo.toml) makes a release: the executables of Windows, Linux and macOS,
# their signatures for the automatic update (crates/eoview/src/update.rs), the Windows installer and the
# install script of Linux and macOS.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: eoview-windows-x86_64.exe
          # The oldest supported Ubuntu: the executable needs this glibc or a newer one.
          - os: ubuntu-22.04
            asset: eoview-linux-x86_64
          - os: macos-latest
            asset: eoview-macos-aarch64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag is the version of Cargo.toml
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
      - run: cargo build --release --locked -p eoview
        env:
          EOVIEW_RELEASE: '1'
      - run: |
          mkdir out
          cp target/release/eoview${{ runner.os == 'Windows' && '.exe' || '' }} out/${{ matrix.asset }}
      - if: runner.os == 'macOS'
        run: codesign --force -s - out/${{ matrix.asset }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$("$env:GITHUB_REF_NAME".TrimStart('v'))" packaging\eoview.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Signatures
        env:
          KEY: ${{ secrets.EOVIEW_SIGNING_KEY }}
        run: |
          printf '%s\n' "$KEY" > key.pem
          # The key is the key of update.rs.
          test "$(openssl pkey -in key.pem -pubout -outform DER | tail -c 32 | od -An -tu1 -v | xargs | tr ' ' ',')" = \
            "$(sed -n 's/^const KEY: \[u8; 32\] = \[\(.*\)\];/\1/p' crates/eoview/src/update.rs | tr -d ' ')"
          for f in out/eoview-*; do openssl pkeyutl -sign -inkey key.pem -rawin -in "$f" -out "$f.sig"; done
          rm key.pem
      - run: |
          echo "${GITHUB_REF_NAME#v}" > out/version.txt
          cp scripts/install.sh out/
          cp crates/eoview/assets/eoview-256.png out/eoview.png
          gh release create "$GITHUB_REF_NAME" out/* --title "eoview ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
