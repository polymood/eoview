[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/polymood/eoview"

[workspace.dependencies]
eo-core = { path = "crates/eo-core" }
eo-io = { path = "crates/eo-io" }
eo-cache = { path = "crates/eo-cache" }
eo-render = { path = "crates/eo-render" }
bytemuck = { version = "1.25.2", features = ["derive"] }
bytes = "1"
half = { version = "2.7.1", features = ["bytemuck", "std"] }
rayon = "1.12.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "macros", "time"] }
wgpu = "30.0.1"
egui = "0.36"
egui-wgpu = "0.36"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

